 width="29px" height="31px" name="CF100010AA00ENG"></div></td><td valign="middle" align="left" class="entry"><div class="ptxt noBottomMargin">: 車輛前方</div></td></tr></tbody></table></div><div class="attention2"><div class="atten-title">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">檢查油位時將點火開關關閉。</div></div></div><div class="list1 noBottomMargin"><ul class="bullet"><li class="item noBottomMargin"><div class="ptxt noBottomMargin">油位應與加油塞安裝孔底部齊平。必要時添加分動箱油。</div></li></ul></div></div><div class="s1"><div class="ptxt">在加油塞上安裝墊片並安裝於分動箱總成。</div><div class="attention2 noBottomMargin"><div class="atten-title">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">請勿重複使用墊片。</div></div></div></div><div class="s1 noBottomMargin"><div class="ptxt noBottomMargin">將加油塞鎖緊至規定扭力。</div></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N802030080000H00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
