</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">交車前檢查 - 車身</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N804020090000400ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N8040200A0000400ENG"><div class="title"><span>6. 門鎖系統與車門鉸鏈作動</span><div class="sieid">N8040200A0000400ENG</div></div><div class="s1"><div class="figureleftside"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF3006A9AA00ENG.webp', 'CF3006A9AA00ENG')"><img src="../img/CF3006A9AA00ENG.webp" width="325px" height="215px" large="../img/large/CF3006A9AA00ENG.webp"></a></div><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/CF3006AAAA00ENG.webp', 'CF3006AAAA00ENG')"><img src="../img/CF3006AAAA00ENG.webp" width="323px" height="213px" large="../img/large/CF3006AAAA00ENG.webp"></a></div></div><div class="ptxt noBottomMargin">開啟各車門，檢查釋放機構及作動是否順暢。</div></div><div class="s1"><div class="ptxt noBottomMargin">關閉車門，檢查門鎖扣與撞針。</div></div><div class="s1"><div class="ptxt noBottomMargin">開啟車門，操作鎖定拉桿後關閉車門，檢查門鎖。</div></div><div class="s1"><div class="ptxt noBottomMargin">將車門半關，檢查車門開啟止擋。</div></div><div class="s1"><div class="ptxt noBottomMargin">以鑰匙解鎖各車門，檢查門鎖作動。</div></div><div class="s1"><div class="ptxt noBottomMargin">確認所有車門皆可藉鎖定按鈕上鎖。</div></div><div class="attention3"><div class="atten-title"><img class="attentionIcon" src="../icon/reference.webp">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">視需要調整並潤滑車門門鎖扣、撞針及門鎖。</div></div></div><div class="figureleftside"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/CF3006ABAA00ENG.webp', 'CF3006ABAA00ENG')"><img src="../img/CF3006ABAA00ENG.webp" width="325px" height="215px" large="../img/large/CF3006ABAA00ENG.webp"></a></div></div><div class="s1"><div class="ptxt noBottomMargin">確認當車門端部兒童安全鎖旋鈕移至「鎖定」位置且車內鎖定柱塞拉起時，後車門無法以內側車門把手開啟。</div></div><div class="attention3"><div class="atten-title"><img class="attentionIcon" src="../icon/reference.webp">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">將鎖定設為「解除」位置，解除兩後車門兒童安全鎖。（四門車型）</div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N8040200B0000400ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
