v class="title">安裝</div><div class="ptxt">注意下列事項，然後依拆卸相反順序安裝。</div><div class="attention2 noBottomMargin"><div class="atten-title">注意：</div><div class="atten-body"><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">若拆卸時濾清器變形/損壞，請以新品更換。變形/損壞的濾清器可能導致集塵效能降低。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">安裝時請極小心處理濾清器，避免變形/損壞。</div></li></ul></div></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N802050010000T00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
