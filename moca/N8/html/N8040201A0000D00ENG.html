</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">交車前檢查 - 路試後</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N804020190000D00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N8040201A0000D00ENG"><div class="title"><span>39. 散熱器冷卻液液位</span><div class="sieid">N8040201A0000D00ENG</div></div><div class="s1"><div class="attention2"><div class="atten-title">注意：</div><div class="atten-body"><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">冷卻系統處於加壓狀態時，請勿拆卸散熱器蓋。</div></li><li class="item"><div class="ptxt noBottomMargin">拆卸散熱器蓋時，請注意蒸氣與沸騰的水。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">如需補充，僅可向儲液罐加入冷卻液。</div></li></ul></div></div></div><div class="figureleftside"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/CF3006B3AA00ENG.webp', 'CF3006B3AA00ENG')"><img src="../img/CF3006B3AA00ENG.webp" width="325px" height="215px" large="../img/large/CF3006B3AA00ENG.webp"></a></div></div><div class="ptxt noBottomMargin">檢查在正常引擎運轉溫度下，儲液罐內冷卻液液位是否在「LOW」標記處或以上。並檢查冷卻系統是否洩漏。</div></div><div class="s1"><div class="ptxt noBottomMargin">檢查冷卻液濃度是否為 30% 至 60%。</div></div><div class="s1"><div class="ptxt">若液位過低，請向儲液罐補充冷卻液。</div><div class="attention3 noBottomMargin"><div class="atten-title"><img class="attentionIcon" src="../icon/reference.webp">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">有關建議使用的冷卻液，請參閱定期檢查與保養。</div></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N8040201B0000D00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
