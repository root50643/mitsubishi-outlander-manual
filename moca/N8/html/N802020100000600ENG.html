</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">定期檢查與保養 - 引擎室內作業</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N802020090000O00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N802020100000600ENG"><div class="title"><span>檢查煞車油壺液位</span><div class="sieid">N802020100000600ENG</div></div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt">檢查油壺內煞車油液位是否在標準範圍內（介於 最大 – MIN 刻度線之間）。</div><div id="fig1" class="figure noBottomMargin"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100AJSAA00ENG.webp', 'CF100AJSAA00ENG')"><img src="../img/CF100AJSAA00ENG.webp" width="301px" height="213px" large="../img/large/CF100AJSAA00ENG.webp"><div class="caption noBottomMargin">CF100AJSAA00ENG</div></a></div></div></li><li class="item"><div class="ptxt noBottomMargin">目視檢查油壺周圍是否有煞車油洩漏。</div></li><li class="item"><div class="ptxt noBottomMargin">若液位極低（低於 MIN），檢查煞車系統是否有洩漏。</div></li><li class="item"><div class="ptxt noBottomMargin">若鬆開駐車煞車後警示燈仍持續亮起，檢查煞車系統是否有漏油。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">檢查油壺內是否混入異物（例如灰塵）及煞車油以外的油品。</div></li></ul></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N802020110000500ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
