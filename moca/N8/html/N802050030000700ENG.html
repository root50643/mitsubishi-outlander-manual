</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">定期檢查與保養 - 作業 車輛外部</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N802050020000800ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N802050030000700ENG"><div class="title"><span>檢查煞車軟管與管路洩漏</span><div class="sieid">N802050030000700ENG</div></div><div class="s1"><div class="ptxt noBottomMargin">檢查煞車管路（硬管與軟管）是否有龜裂、劣化或其他損壞。更換任何損壞零件。</div></div><div class="s1"><div class="ptxt">以 785 N（80 kg，176 lb）的力量踩下煞車踏板，並在引擎運轉時保持踩下踏板約 5 秒。檢查是否有液體洩漏。</div><div id="fig2" class="figure"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100AJTAA00ENG.webp', 'CF100AJTAA00ENG')"><img src="../img/CF100AJTAA00ENG.webp" width="301px" height="213px" large="../img/large/CF100AJTAA00ENG.webp"><div class="caption noBottomMargin">CF100AJTAA00ENG</div></a></div></div><div class="attention2 noBottomMargin"><div class="atten-title">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">若有煞車油洩漏，將適用接頭重新鎖緊至規定扭力，並修復任何異常（損壞、磨損或變形）零件。</div></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N802050040000700ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
