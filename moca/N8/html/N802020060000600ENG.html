</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">定期檢查與保養 - 引擎室內作業</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N802020050000100ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N802020060000600ENG"><div class="title"><span>檢查儲液罐引擎冷卻液液位</span><div class="sieid">N802020060000600ENG</div></div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt">檢查儲液罐引擎冷卻液液位是否在「MIN」至「最大」範圍內（引擎冷卻時）。</div><div id="fig1" class="figure"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF1009TXAA00ENG.webp', 'CF1009TXAA00ENG')"><img src="../img/CF1009TXAA00ENG.webp" width="301px" height="213px" large="../img/large/CF1009TXAA00ENG.webp"><div class="caption noBottomMargin">CF1009TXAA00ENG</div></a></div></div><div class="table noBottomMargin"><table class="all tgroup notspec"><colgroup><col style="width:12.5%;"><col style="width:87.5%;"></colgroup><tbody class="tbody noBottomMargin"><tr class="row"><td valign="middle" align="left" class="entry"><div class="ptxt noBottomMargin"><img class="inline" src="../img/CF1000KSAA00ENG.webp" width="16px" height="16px" name="CF1000KSAA00ENG"></div></td><td valign="middle" align="left" class="entry"><div class="ptxt noBottomMargin">: 最大</div></td></tr><tr class="row noBottomMargin"><td valign="middle" align="left" class="entry"><div class="ptxt noBottomMargin"><img class="inline" src="../img/CF1000KUAA00ENG.webp" width="16px" height="16px" name="CF1000KUAA00ENG"></div></td><td valign="middle" align="left" class="entry"><div class="ptxt noBottomMargin">: MIN</div></td></tr></tbody></table></div></li><li class="item noBottomMargin"><div class="ptxt">如有必要，調整引擎冷卻液液位。</div><div class="attention2"><div class="atten-title">警告：</div><div class="atten-body"><div class="ptxt noBottomMargin">補充三菱汽車原廠 SUPER LONG LIFE COOLANT PREMIUM 或同等品。</div></div></div><div class="attention1 noBottomMargin"><div class="atten-title">警告：</div><div class="atten-body"><div class="ptxt noBottomMargin">為避免冷卻液過熱時噴出，切勿將冷卻液加至超過最大液位。</div></div></div></li></ul></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N802020070000Y00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
