</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">通風、暖氣與冷氣 - 暖氣與空調系統 - 基本檢查 - 冷媒&lt;4B4&gt;</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5090204B0000L00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N509020560000200ENG"><div class="title"><span>回收冷媒/補充冷媒</span><div class="sieid">N509020560000200ENG</div></div><div class="attention2"><div class="atten-title">注意：</div><div class="atten-body"><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">切勿過量補充冷媒，否則空調系統可能受損。</div></li><li class="item"><div class="ptxt noBottomMargin">務必使冷媒遠離熱源、電火花或火焰衝擊。若有火焰存在，冷媒會形成有毒氣體。請保持作業區域通風良好。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">請依規定程序回收冷媒。切勿排放至大氣中。</div></li></ul></div></div></div><div class="ptxt">使用冷媒回收機回收冷媒，並補充規定數量的冷媒。</div><div class="attention3"><div class="atten-title"><img class="attentionIcon" src="../icon/reference.webp">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">有關本機之作動，請參閱冷媒回收與再生裝置使用手冊。</div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N509020110000U00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
