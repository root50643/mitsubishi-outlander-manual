</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">變速箱與傳動系 - 前軸 - 2WD - 拆卸與安裝 - 前輪毂與轉向節</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5040404E0001P00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5040401X0003100ENG"><div class="title"><span>檢查</span><div class="sieid">N5040401X0003100ENG</div></div><div class="servinfosub" id="id0000000015316832S01"><div class="title">拆卸後檢查</div><div class="ptxt">檢查下列項目，必要時更換零件。</div><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">檢查零件是否有變形、裂縫及其他損壞。</div></li><li class="item noBottomMargin"><div class="ptxt">檢查橫向連桿及轉向外球頭防塵套是否有破損、軸向鬆動及擺動扭力。</div><div class="list2 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">橫向連桿：請參閱檢查<a href="javascript:void(0)" onclick="openSIE('N5050102H0002S00ENG'); return false;">檢查</a>.</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">轉向外球頭：請參閱<a href="javascript:void(0)" onclick="openSIE('N5070102O0001P00ENG'); return false;">檢查</a>.</div></li></ul></div></li></ul></div></div><div class="servinfosub" id="id0000000015316832S02"><div class="title">安裝後檢查</div><div class="topic noBottomMargin"><div id="pro1" class="s1"><div class="ptxt noBottomMargin" id="par1">更換碟盤時，檢查碟盤的偏擺量。請參閱<a href="javascript:void(0)" onclick="openSIE('N5060103C0006600ENG'); return false;">檢查</a>.</div></div><div class="s1"><div class="ptxt noBottomMargin">檢查輪速感測器線束是否連接正確。請參閱<a href="javascript:void(0)" onclick="openSIE('N5060302N0001800ENG'); return false;">爆炸圖</a>. </div></div><div class="s1"><div class="ptxt noBottomMargin">檢查車輪校正。請參閱<a href="javascript:void(0)" onclick="openSIE('N5050102H0004P00ENG'); return false;">檢查</a>.</div></div><div class="s1 noBottomMargin"><div class="ptxt noBottomMargin">調整轉向角感測器的中立位置。請參閱<a href="javascript:void(0)" onclick="openSIE('N506030200006600ENG'); return false;">說明</a>.</div></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5040404E0001Q00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
