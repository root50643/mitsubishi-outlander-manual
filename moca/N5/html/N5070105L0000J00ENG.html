iv class="title">系統內個別功能</div><div class="ptxt noBottomMargin">加熱方向盤開關的開啟/關閉訊號會傳送至空調放大器。</div></div><div class="servinfosub" id="id0000000014676241S03"><div class="title">個別作動</div><div class="ptxt noBottomMargin">當駕駛按下按鈕時，內部電路導通；再次按下按鈕時，內部電路斷開。</div></div><div class="servinfosub" id="id0000000014676242S03"><div class="title">零件位置</div><div class="ptxt noBottomMargin">加熱方向盤開關包含於空調開關總成內。請參閱<a href="javascript:void(0)" onclick="openSIE('N507010150000L00ENG'); return false;">元件位置</a>.</div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5070105K0000C00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
