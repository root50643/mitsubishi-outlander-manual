</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">引擎&lt;4B4&gt; - 引擎與排放控制 - 排放控制 - 曲軸箱排放控制系統</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5024800I0000D00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5024800K0000C00ENG"><div class="title"><span>概述（曲軸箱排放控制系統）</span><div class="sieid">N5024800K0000C00ENG</div></div><div class="servinfosub" id="a1"><div class="ptxt">曲軸箱排放控制系統防止曲軸箱內竄氣逸出至大氣。</div><div class="ptxt">新鮮空氣經通氣軟管由空氣濾清器送入曲軸箱。</div><div class="ptxt">空氣與曲軸箱內的竄氣混合。</div><div class="ptxt">曲軸箱內的竄氣經曲軸箱正壓通風閥被吸入進氣歧管。</div><div class="ptxt">曲軸箱正壓通風閥依進氣歧管真空度升降柱塞，以適當調節竄氣流量。</div><div class="ptxt noBottomMargin">換言之，引擎低負荷作動時調節竄氣流量以維持引擎穩定性，高負荷作動時則增加流量以改善通風性能。</div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5024800L0000D00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
