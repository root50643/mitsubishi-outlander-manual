</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">懸吊系統 - 後懸吊系統 - 拆卸與安裝 - 半軸拉桿</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N505020210005X00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5050203N0002O00ENG"><div class="title"><span>拆卸與安裝</span><div class="sieid">N5050203N0002O00ENG</div></div><div class="servinfosub" id="id0000000015318632S01"><div class="title">拆卸</div><div class="topic noBottomMargin"><div class="s1"><div class="ptxt noBottomMargin">拆卸輪胎。請參閱拆卸與安裝<a href="javascript:void(0)" onclick="openSIE('N5050404X0000L00ENG'); return false;">拆卸與安裝</a>.</div></div><div class="s1"><div class="ptxt">拆卸半拖曳臂<img class="inline" src="../img/CF1000PMAA00ENG.webp" width="16px" height="16px" name="CF1000PMAA00ENG">安裝螺栓<img class="inline" src="../img/CF1000KSAA00ENG.webp" width="16px" height="16px" name="CF1000KSAA00ENG">及螺帽<img class="inline" src="../img/CF1000KUAA00ENG.webp" width="16px" height="16px" name="CF1000KUAA00ENG">.</div><div id="fig1" class="figure noBottomMargin"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100AHXAA00ENG.webp', 'CF100AHXAA00ENG')"><img src="../img/CF100AHXAA00ENG.webp" width="301px" height="213px" large="../img/large/CF100AHXAA00ENG.webp"><div class="caption noBottomMargin">CF100AHXAA00ENG</div></a></div></div></div><div class="s1"><div class="ptxt noBottomMargin">拆卸半拖曳臂。</div></div><div class="s1 noBottomMargin"><div class="ptxt noBottomMargin">拆卸後執行檢查。請參閱<a href="javascript:void(0)" onclick="openSIE('N5050202H0003I00ENG'); return false;">檢查</a>.</div></div></div></div><div class="servinfosub" id="id0000000015318632S02"><div class="title">安裝</div><div class="ptxt">注意下列事項，並依拆卸之相反順序安裝。</div><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">在空載狀態、輪胎置於平坦地面的車輛安裝位置（橡膠襯套），對固定零件執行最終鎖緊。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">安裝後執行檢查。請參閱<a href="javascript:void(0)" onclick="openSIE('N5050202H0003I00ENG'); return false;">檢查</a>.</div></li></ul></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5050202H0003I00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
