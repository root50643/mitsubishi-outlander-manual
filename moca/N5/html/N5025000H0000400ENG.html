</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">引擎&lt;4B4&gt; - 直接噴射與多點燃油噴射（DI 與 MPI） - 說明 - 感測器</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5025000G0000300ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5025000H0000400ENG"><div class="title"><span>線性空燃比感測器</span><div class="sieid">N5025000H0000400ENG</div></div><div class="figureleftside"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF30029KAB00ENG.webp', 'DF30029KAB00ENG')"><img class=" noframe" src="../img/DF30029KAB00ENG.webp" width="325px" height="325px" large="../img/large/DF30029KAB00ENG.webp"></a></div></div><div class="ptxt">線性空燃比感測器安裝於渦輪增壓器下方觸媒轉換器上游側。此感測器利用固體電解質（氧化鋯）偵測排氣中的氧濃度，可在稀混合氣至濃混合氣的寬範圍內偵測空燃比。引擎控制單元對線性空燃比感測器施加電壓並量測電流，以判定空燃比；因此引擎控制單元可精確執行空燃比回饋控制，使三元觸媒轉換效率達到最佳理論空燃比。</div><div class="ptxt">為啟動元件，此感測器內建加熱器。引擎控制單元控制流經加熱器的電流。</div><div class="figure"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF30017TAD00ENG.webp', 'DF30017TAD00ENG')"><img class=" noframe" src="../img/DF30017TAD00ENG.webp" width="869px" height="505px" large="../img/large/DF30017TAD00ENG.webp"></a></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5025000J0000400ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
