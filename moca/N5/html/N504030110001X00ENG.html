</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">TRANSMISSION &amp; DRIVELINE - 傳動系 - 分動箱 - 症狀診斷 - AWD 高溫顯示於資訊顯示器</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N50403017000D300ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N504030110001X00ENG"><div class="title"><span>說明</span><div class="sieid">N504030110001X00ENG</div></div><div class="ptxt">行駛時，4WD 警告（4WD 高溫。停止車輛）會顯示於資訊顯示器（儀表）。</div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">此症狀在電液耦合器承受重負載且多片離合器溫度升高時，用以保護傳動系零件。同時會顯示 4WD 警告（4WD 高溫。停止車輛）。此情形並非故障。請參閱<a href="javascript:void(0)" onclick="openSIE('N5040302I0000P00ENG'); return false;">保護功能</a>.</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">當此症狀發生時，停止車輛並讓引擎怠速運轉一段時間。顯示將停止，系統將恢復正常。</div></li></ul></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N504030110001Y00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
