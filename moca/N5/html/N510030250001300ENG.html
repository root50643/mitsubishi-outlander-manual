span="1"><div class="ptxt noBottomMargin">供應至通風座椅的電源處於異常狀態 (低於 10.0 V 或超過 16.0 V)。</div></td><td valign="middle" align="left" class="entry botright" rowspan="1"><div class="ptxt noBottomMargin">通風座椅作動暫停。</div></td><td valign="middle" align="left" class="entry botright" rowspan="1"><div class="ptxt noBottomMargin">電源恢復正常 (10.0 V - 16.0 V 以下)</div></td></tr></tbody></table></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5100405F0001A00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
