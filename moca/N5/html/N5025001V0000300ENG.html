</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">引擎&lt;4B4&gt; - 直接噴射與多點燃油噴射 (DI 及 MPI) - 說明</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5025012X0000200ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5025001V0000300ENG"><div class="title"><span>電動水泵控制</span><div class="sieid">N5025001V0000300ENG</div></div><div class="ptxt">水冷式中冷器具有與引擎冷卻液不同的冷卻路徑，且冷卻液由電動水泵循環輸送。</div><div class="ptxt">ECM依據行駛條件，透過PWM（Pulse Wide Modulation）改變電動水泵轉速，將進氣溫度控制在適當溫度。</div><div class="ptxt">此外，ECM會監控轉速，並依據電動水泵回傳的實際轉速訊號（PWM）檢查是否達到目標轉速。</div><div class="figure"><div class="title">系統配置圖</div><div id="i-4qdfkdt9h5vu4esu0nv5o07ai4" class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF3001Z7AD00ENG.webp', 'DF3001Z7AD00ENG')"><img class=" noframe" src="../img/DF3001Z7AD00ENG.webp" width="853px" height="554px" large="../img/large/DF3001Z7AD00ENG.webp"></a></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5025012Z0000700ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
