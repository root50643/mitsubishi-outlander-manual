</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">ELECTRICAL &amp; POWER CONTROL - LAN SYSTEM - CAN FUNDAMENTAL - 系統說明 - CAN 通訊系統</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5140304S0000J00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5140304B0000S00ENG"><div class="title"><span>系統說明</span><div class="sieid">N5140304B0000S00ENG</div></div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">CAN 通訊為多工通訊系統。藉由以兩條通訊線路（CAN-H 與 CAN-L）連接各控制單元，本系統可在高速下傳輸及接收大量資料。</div></li><li class="item"><div class="ptxt noBottomMargin">各控制單元開啟 CAN 網路，使用 CAN 通訊控制電路傳送訊號。其僅接收來自其他控制單元之必要訊號以作動各項功能。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">CAN 通訊線路採用雙絞線式 (兩條線路絞合) 以提高抗雜訊能力。</div></li></ul></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5140304V0000J00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
