</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">RESTRAINTS - 氣囊 AIRBAG - 拆卸與安裝 - 安全帶預緊器</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N508030310007200ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N508030260000B00ENG"><div class="title"><span>檢查</span><div class="sieid">N508030260000B00ENG</div></div><div class="servinfosub" id="a1"><div class="attention4"><div class="atten-title">危險：</div><div class="atten-body"><div class="ptxt noBottomMargin">切勿嘗試量測安全帶預緊器及腰帶預緊器（引爆器）的電路電阻，即使使用的是指定測試器亦同。若使用量測器進行電路電阻量測，可能導致安全氣囊意外引爆，並可能造成嚴重人身傷害。</div></div></div><div class="attention1"><div class="atten-title">警告：</div><div class="atten-body"><div class="ptxt noBottomMargin">若在下列檢查中發現任何零件損壞，請以更換安全帶預緊器。</div></div></div><div class="ptxt">若在下列檢查中發現任何異常，請以更換安全帶預緊器。</div><div class="list1 noBottomMargin"><ol class="arabicnum"><li class="item"><div class="ptxt noBottomMargin">檢查安全帶預緊器及腰帶預緊器是否有凹陷、裂縫或變形。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">檢查線束及接頭是否有損壞，並檢查端子是否變形。</div></li></ol></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N508030310007100ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
