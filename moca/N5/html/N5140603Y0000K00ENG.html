</table></div><div class="attention2"><div class="atten-title">注意：</div><div class="atten-body"><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">若大電流保險絲熔斷，可能是重要電路（電源供應或大通流電路）短路所致。在這種情況下，請仔細檢查並排除故障原因。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">切勿以乙烯基膠帶包裹大電流保險絲外側。重要：切勿讓大電流保險絲接觸其他任何線路、乙烯基或橡膠零件。</div></li></ul></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N514060420001100ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
