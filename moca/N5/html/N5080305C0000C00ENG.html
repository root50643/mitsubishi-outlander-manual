</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">拘束裝置 - 氣囊 AIRBAG - 系統說明 - 零件 - 主要零件與功能</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5080305B0000G00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5080305C0000C00ENG"><div class="title"><span>氣囊警示燈</span><div class="sieid">N5080305C0000C00ENG</div></div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt">當氣囊系統及安全帶預緊器電氣系統偵測到故障時，氣囊警示燈點亮或閃爍，表示系統故障。</div><div id="fig1" class="figure noBottomMargin"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100AQVAA00ENG.webp', 'CF100AQVAA00ENG')"><img src="../img/CF100AQVAA00ENG.webp" width="301px" height="213px" large="../img/large/CF100AQVAA00ENG.webp"><div class="caption noBottomMargin">CF100AQVAA00ENG</div></a></div></div></li><li class="item noBottomMargin"><div class="ptxt">為作動檢查目的，電源開關轉為開啟後，氣囊警示燈點亮 7 秒。在此期間內，氣囊診斷感知器單元執行系統診斷。</div><div class="attention3 noBottomMargin"><div class="atten-title"><img class="attentionIcon" src="../icon/reference.webp">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">電源開關轉為開啟後約 7 秒內（氣囊警示燈點亮期間），氣囊及安全帶預緊器不作動。</div></div></div></li></ul></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5080305D0000A00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
