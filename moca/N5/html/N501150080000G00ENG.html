</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">一般資訊 - 一般資訊 - 基本檢查 - 故障排除/檢查要領使用方式</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N501150100000O00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N501150080000G00ENG"><div class="title"><span>燒毀/熔斷保險絲之檢查要領</span><div class="sieid">N501150080000G00ENG</div></div><div class="figureleftside"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/CF2002EZAA00ENG.webp', 'CF2002EZAA00ENG')"><img src="../img/CF2002EZAA00ENG.webp" width="325px" height="453px" large="../img/large/CF2002EZAA00ENG.webp"></a></div></div><div class="ptxt">拆下燒毀/熔斷之保險絲，量測該保險絲負載側與搭鐵之間的電阻。將連接於此保險絲之所有電路開關關閉。若此時電阻接近 0 Ω，表示這些開關與負載之間某處有短路。若電阻不為 0 Ω，表示目前無短路，但可能是瞬間短路導致保險絲熔斷。</div><div class="ptxt">短路的主要原因如下。</div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">線束被車身夾住</div></li><li class="item"><div class="ptxt noBottomMargin">線束外皮因磨損或高溫而損壞</div></li><li class="item"><div class="ptxt noBottomMargin">水進入接頭或電路</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">人為疏失（誤將電路短路等）</div></li></ul></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N501160100000200ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
