</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">車身內裝 - 座椅 - 系統說明 - 系統 - 電動座椅系統</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N510030710000900ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5100304T0002K00ENG"><div class="title"><span>系統說明</span><div class="sieid">N5100304T0002K00ENG</div></div><div class="ptxt">電動座椅不論點火開關位置如何皆可操作，因為電源一直供應至電動座椅開關。</div><div class="servinfosub" id="id0000000013523651S01"><div class="title">滑動作動</div><div class="ptxt noBottomMargin">操作電動座椅開關上的滑動開關時，滑動馬達作動，可進行座椅前後位置調整。</div></div><div class="servinfosub" id="id0000000013523651S02"><div class="title">傾倒作動</div><div class="ptxt noBottomMargin">操作電動座椅開關上的傾倒開關時，傾倒馬達作動，可進行椅背前後位置調整。</div></div><div class="servinfosub" id="id0000000013523651S03"><div class="title">升降作動</div><div class="ptxt noBottomMargin">操作電動座椅開關上的升降開關時，升降馬達作動，可進行座椅上下位置調整。</div></div><div class="servinfosub" id="idSE1"><div class="title">大腿支撐作動</div><div class="ptxt noBottomMargin">操作電動座椅開關上的大腿支撐開關時，大腿支撐馬達作動，可進行座椅墊（前側）上下位置調整。</div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5100304T0002L00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
