</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">引擎&lt;4B4&gt; - 直接噴射及多點燃油噴射 (DI AND MPI) - 說明 - 感測器</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N502500080000400ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N502500090000400ENG"><div class="title"><span>No.1 進氣溫度感測器</span><div class="sieid">N502500090000400ENG</div></div><div class="figureleftside"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF30016PAA00ENG.webp', 'DF30016PAA00ENG')"><img class=" noframe" src="../img/DF30016PAA00ENG.webp" width="325px" height="215px" large="../img/large/DF30016PAA00ENG.webp"></a></div></div><div class="ptxt">No.1 進氣溫度感測器內建於空氣流量感測器。感測器偵測進氣溫度。溫度感測單元使用對溫度變化敏感的熱敏電阻。偵測到的進氣溫度由空氣流量感測器內的訊號處理電路依進氣溫度轉換為電壓，並輸出至 ECM。ECM 使用此輸出訊號與引擎車速計算並決定基本燃油噴射時間。</div><div class="spec"><div class="ptxt">&lt;Reference data&gt;</div><div class="tablerightside noBottomMargin"><table><tr><td> </td><td><table class="all tgroup"><colgroup><col style="width:50%;"><col style="width:50%;"></colgroup><thead class="thead"><tr class="row noBottomMargin"><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">進氣溫度</div></td><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">感測器輸出電壓</div></td></tr></thead><tbody class="tbody noBottomMargin"><tr class="row noBottomMargin"><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">25°C</div></td><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">Approx. 2 V</div></td></tr></tbody></table></td></tr></table></div></div><div class="figure"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF30017GAB00ENG.webp', 'DF30017GAB00ENG')"><img class=" noframe" src="../img/DF30017GAB00ENG.webp" width="853px" height="369px" large="../img/large/DF30017GAB00ENG.webp"></a></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5025000A0000300ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
