</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">懸吊 - 後懸吊 - 預防措施 - 預防措施/注意事項</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5050203C0000I00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5050203D0000D00ENG"><div class="title"><span>懸吊預防措施/注意事項</span><div class="sieid">N5050203D0000D00ENG</div></div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt">安裝橡膠襯套時，最終鎖緊必須在空載狀態且輪胎著地的情況下進行。溢出的機油可能縮短橡膠襯套壽命。務必擦拭掉任何溢出的機油。</div><div class="list2 noBottomMargin"><ul class="bullet"><li class="item noBottomMargin"><div class="ptxt noBottomMargin">空載狀態表示燃油、引擎冷卻液及潤滑油均為滿油位。備胎、千斤頂、手工具及腳墊均置於指定位置。</div></li></ul></div></li><li class="item"><div class="ptxt noBottomMargin">懸吊零件維修後，務必檢查輪胎定位。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">自鎖螺帽不可重複使用。安裝時一律使用新的螺帽。由於新的自鎖螺帽已預先塗油，請直接鎖緊。</div></li></ul></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5050203V0000800ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
