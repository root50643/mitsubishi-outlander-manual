</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">引擎&lt;4B4&gt; - 直接噴射與多點燃油噴射（DI 及 MPI）- 說明 - 感知器</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5025000Y0000301ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5025000W0000300ENG"><div class="title"><span>空調壓力感知器</span><div class="sieid">N5025000W0000300ENG</div></div><div class="figureleftside"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF3001GYAA00ENG.webp', 'DF3001GYAA00ENG')"><img class=" noframe" src="../img/DF3001GYAA00ENG.webp" width="325px" height="215px" large="../img/large/DF3001GYAA00ENG.webp"></a></div></div><div class="ptxt">空調壓力感知器安裝於位於空調冷凝器出口側的液管總成上。空調壓力感知器偵測冷媒壓力（空調負載），並將與冷媒壓力相對應的電壓輸出至 ECM。感知器使用靜電容壓壓力轉換器，將冷媒壓力轉換為電壓。ECM 使用此輸出電壓來計算空調壓縮機的校正扭力。</div><div class="figure"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF3001GZAC00ENG.webp', 'DF3001GZAC00ENG')"><img class=" noframe" src="../img/DF3001GZAC00ENG.webp" width="853px" height="294px" large="../img/large/DF3001GZAC00ENG.webp"></a></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5025000Z0000300ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
