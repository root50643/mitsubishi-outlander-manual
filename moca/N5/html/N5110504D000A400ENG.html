下玻璃蓋固定螺絲<img class="inline" src="../img/CF1000KSAA00ENG.webp" width="16px" height="16px" name="CF1000KSAA00ENG">.</div><div id="fig1" class="figure noBottomMargin"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100BG3AA00ENG.webp', 'CF100BG3AA00ENG')"><img src="../img/CF100BG3AA00ENG.webp" width="301px" height="213px" large="../img/large/CF100BG3AA00ENG.webp"><div class="caption noBottomMargin">CF100BG3AA00ENG</div></a></div></div></div><div id="pro2" class="s1 noBottomMargin"><div class="ptxt noBottomMargin" id="par4">拆下玻璃蓋。</div></div></div></div><div class="servinfosub" id="id0000000015312618S02"><div class="title">安裝</div><div class="ptxt">注意下列事項，然後依拆卸的相反順序安裝。</div><div class="attention2"><div class="atten-title">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">安裝玻璃蓋後，進行漏水測試並檢查無異常。</div></div></div><div class="attention3 noBottomMargin"><div class="atten-title"><img class="attentionIcon" src="../icon/reference.webp">注意：</div><div class="atten-body"><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin" id="par5">安裝前，將玻璃蓋向上傾斜以確保作業空間。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">安裝後，進行安裝調整。請參閱<a href="javascript:void(0)" onclick="openSIE('N5110504H0001H00ENG'); return false;">調整</a>.</div></li></ul></div></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5110504H0001H00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
