</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">引擎&lt;4B4&gt; - 動力總成支架 - 說明</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5024801I0000F00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N502490150000C00ENG"><div class="title"><span>說明</span><div class="sieid">N502490150000C00ENG</div></div><div class="servinfosub"><div class="ptxt">採用擺錘式引擎支架，由引擎安裝支架、變速箱安裝支架及扭力桿組成。</div><div class="ptxt">此支架系統具有以下特點：</div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">動力總成質量沿慣性軸線支撐，扭力反作用力由扭力桿以縱向力控制，而非對噪音與振動敏感的垂直力。</div></li><li class="item"><div class="ptxt noBottomMargin">引擎翻滾限制桿具有兩個橡膠金屬襯套，可雙重降低振動與噪音。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">引擎側採用液封支架，可降低噪音與振動的傳遞，並提升乘坐舒適性。</div></li></ul></div><div class="topic noBottomMargin"><div class="title">構造圖</div><div class="figure noBottomMargin"><div id="i-nmd1rb6a2f3d4ell1d4h4c7ft6" class="graphic"><a href="javascript:ViewLargeIllust('../img/large/DF30014RAA00ENG.webp', 'DF30014RAA00ENG')"><img src="../img/DF30014RAA00ENG.webp" width="848px" height="686px" large="../img/large/DF30014RAA00ENG.webp"><div class="caption noBottomMargin">DF30014RAA00ENG</div></a></div></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N502490110000C00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
