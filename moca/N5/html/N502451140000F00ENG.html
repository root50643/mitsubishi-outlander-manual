</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">引擎&lt;4B4&gt; - 進排氣系統 - 車上服務</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N502451130000I00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N502451140000F00ENG"><div class="title"><span>空氣旁通閥檢查</span><div class="sieid">N502451140000F00ENG</div></div><div class="s1"><div class="ptxt">拆下中冷器總成及中冷器水軟管 (請參閱 引擎 - 引擎電系 - 點火系統 - 點火線圈<a href="javascript:void(0)" onclick="openSIE('N502461310000I00ENG'); return false;">點火線圈拆卸與安裝</a>).</div><div class="figureleftside noBottomMargin"><div id="i-79pn00ddtsek4tlbrhsjou4nsc" class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF3001H1AA00ENG.webp', 'DF3001H1AA00ENG')"><img src="../img/DF3001H1AA00ENG.webp" width="323px" height="218px" large="../img/large/DF3001H1AA00ENG.webp"></a></div></div></div><div class="s1"><div class="ptxt noBottomMargin">從渦輪增壓器拆下中冷器空氣軟管 (請參閱<a href="javascript:void(0)" onclick="openSIE('N502451180000I00ENG'); return false;">中冷器拆卸與安裝</a>).</div></div><div class="s1"><div class="ptxt">將中冷器總成移至不會妨礙空氣旁通閥檢查的位置。</div><div class="figureleftside noBottomMargin"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF300152AA00ENG.webp', 'DF300152AA00ENG')"><img src="../img/DF300152AA00ENG.webp" width="323px" height="213px" large="../img/large/DF300152AA00ENG.webp"></a></div></div></div><div class="s1"><div class="ptxt noBottomMargin">將手動真空幫浦連接至空氣旁通閥接頭。</div></div><div class="s1"><div class="ptxt">從圖中所示位置將光纖內視鏡插入渦輪增壓器。</div><div class="figureleftside noBottomMargin"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF30016VAA00ENG.webp', 'DF30016VAA00ENG')"><img src="../img/DF30016VAA00ENG.webp" width="323px" height="453px" large="../img/large/DF30016VAA00ENG.webp"></a></div></div></div><div class="s1"><div class="ptxt">檢查空氣旁通閥（膜片）之作動。</div><div class="table noBottomMargin"><table class="all tgroup notspec"><colgroup><col style="width:50%;"><col style="width:50%;"></colgroup><thead class="thead"><tr class="row noBottomMargin"><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">負壓</div></td><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">汽門 作動</div></td></tr></thead><tbody class="tbody noBottomMargin"><tr class="row noBottomMargin"><td valign="middle" align="left" class="entry right"><div class="ptxt noBottomMargin">約 40.5 kPa</div></td><td valign="middle" align="left" class="entry right"><div class="ptxt noBottomMargin">開始開啟</div></td></tr></tbody></table></div></div><div class="s1"><div class="ptxt noBottomMargin">若空氣旁通閥故障，請更換渦輪增壓器總成。</div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N502451630000M00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
