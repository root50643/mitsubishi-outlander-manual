</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">引擎&lt;4B4&gt; - 引擎冷卻 - 車上服務</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N502441180000U00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N502441170000Q00ENG"><div class="title"><span>引擎冷卻液濃度檢查</span><div class="sieid">N502441170000Q00ENG</div></div><div class="ptxt">使用比重計，檢查引擎冷卻液濃度是否在標準值範圍內。</div><div class="spec"><div class="ptxt noBottomMargin">標準值：30 至 60%（維修濃度範圍）</div></div><div class="attention2"><div class="atten-title">注意：</div><div class="atten-body"><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">引擎冷卻液濃度低於 30% 時，防鏽效果較差。濃度超過 60% 時，引擎冷卻液的防凍效果及引擎冷卻性能會降低，對引擎造成不良影響。因此，務必遵守維修濃度範圍。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">使用 MITSUBISHI MOTORS GENUINE SUPER LONG LIFE COOLANT PREMIUM，無須加水，因其濃度已預先調整為 50%。</div></li></ul></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N502441190001200ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
