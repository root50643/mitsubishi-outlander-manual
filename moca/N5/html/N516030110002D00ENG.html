</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">駕駛資訊與多媒體 - 雷達系統 - 基本檢查 - 檢查與調整 - 更換雷達控制單元時的附加服務</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N516030300000M00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N516030110002D00ENG"><div class="title"><span>說明</span><div class="sieid">N516030110002D00ENG</div></div><div class="attention2"><div class="atten-title">警告：</div><div class="atten-body"><div class="ptxt noBottomMargin">更換雷達控制單元時，務必以新品更換。若重複使用其他車輛的雷達控制單元，雷達系統將無法正常運作。</div></div></div><div class="ptxt">更換雷達控制單元時，請執行以下作業。詳情請參閱<a href="javascript:void(0)" onclick="openSIE('N516030320001T00ENG'); return false;">作業程序</a>.</div><div class="servinfosub" id="idSE1"><div class="title">更換後</div><div class="ptxt">更換雷達控制單元後，必須執行以下項目。否則雷達系統將無法正常運作。</div><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">寫入車輛規格</div></li><li class="item"><div class="ptxt noBottomMargin">寫入 MAC 金鑰</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">關閉 Factory Mode</div></li></ul></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N516030320001T00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
