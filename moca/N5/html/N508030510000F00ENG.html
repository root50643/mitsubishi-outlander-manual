</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">拘束裝置 - 氣囊 - 系統說明 - 零件構成 - 引爆器</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5080304R0000A00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N508030510000F00ENG"><div class="title"><span>駕駛員膝部氣囊引爆器</span><div class="sieid">N508030510000F00ENG</div></div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt">駕駛員膝部氣囊引爆器<img class="inline" src="../img/CF1000KSAA00ENG.webp" width="16px" height="16px" name="CF1000KSAA00ENG">主要由電點火裝置 (squib)、點火劑、氣體產生劑及濾清器組成。這些元件儲存於容器內。</div><div id="fig1" class="figure noBottomMargin"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF5001DUAA00ENG.webp', 'DF5001DUAA00ENG')"><img class=" noframe" src="../img/DF5001DUAA00ENG.webp" width="323px" height="213px" large="../img/large/DF5001DUAA00ENG.webp"></a></div></div></li><li class="item noBottomMargin"><div class="ptxt">當正面碰撞超過車輛規定極限時，電點火裝置 (squib) 引燃點火劑。氣體產生劑因點火劑的熱量而燃燒。產生的氣體 (高溫) 經濾清器使氣囊充氣膨脹。</div><div class="attention3 noBottomMargin"><div class="atten-title"><img class="attentionIcon" src="../icon/reference.webp">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">濾清器可去除並冷卻氣體產生劑的殘留物。</div></div></div></li></ul></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N508030530000C00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
