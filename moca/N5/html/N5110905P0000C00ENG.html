</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">車身外部、車門、車頂及車輛安全 - 車身修復 - 基礎 - 服務資訊 - 修復程序及預防措施/注意事項 - 拉力修復程序</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5110905N0000C00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5110905P0000C00ENG"><div class="title"><span>修復順序</span><div class="sieid">N5110905P0000C00ENG</div></div><div class="ptxt">一般而言，碰撞時不會只產生單一種彎曲或扭轉。車身變形是由彎曲、扭轉及其他類型損壞綜合造成的結果。</div><div class="ptxt">修復應從損壞最深處開始進行。</div><div class="ptxt">若只著眼於明顯損壞，而忽略衝擊向整個車身傳遞的情況，便無法取得正確的車身校正。</div><div id="fig1" class="figure"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100BMSAA00ENG.webp', 'CF100BMSAA00ENG')"><img class=" noframe" src="../img/CF100BMSAA00ENG.webp" width="788px" height="213px" large="../img/large/CF100BMSAA00ENG.webp"><div class="caption noBottomMargin">CF100BMSAA00ENG</div></a></div></div><div class="ptxt">修復工作基本上應依此損壞順序進行。</div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5110905Q0000C00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
