</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">駕駛資訊與多媒體 - 音響、影像與導航系統 - 環景監視系統 - 拆卸與安裝 - 前視攝影機</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N51604052000SV00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N51604052000SW00ENG"><div class="title"><span>拆卸與安裝</span><div class="sieid">N51604052000SW00ENG</div></div><div class="attention2 noBottomMargin"><div class="atten-title">注意：</div><div class="atten-body"><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">拆裝或更換攝影機時，應於環景監視器開啟「鳥瞰視角」檢查攝影機影像。如有必要，請校正攝影機（請參閱<a href="javascript:void(0)" onclick="openSIE('N5160407Q0007300ENG'); return false;">作業程序</a>).</div></li><li class="item"><div class="ptxt noBottomMargin">為確保攝影機影像清晰可見，請先用濕布擦拭鏡頭，再用乾布擦去灰塵、雨滴或雪花。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">請小心勿損壞攝影機。任何損壞都可能對螢幕影像造成不良影響。</div></li></ul></div></div></div><div class="servinfosub"><div class="prepostoperation"><table class="all"><tbody class="tbody noBottomMargin"><tr class="row noBottomMargin"><td width="50%" valign="middle" align="left" class="entry all"><div class="title">拆卸前與安裝後作動</div><div class="ptxt noBottomMargin">前保險桿總成拆卸與安裝（請參閱<a href="javascript:void(0)" onclick="openSIE('N511280020000800ENG'); return false;">前保險桿總成拆卸與安裝</a>).</div></td></tr></tbody></table></div><div class="figure noBottomMargin"><div id="i-qm9kagruasq14ntjp66qma72c2" class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF200366AA00ENG.webp', 'DF200366AA00ENG')"><img class=" noframe" src="../img/DF200366AA00ENG.webp" width="787px" height="621px" large="../img/large/DF2
