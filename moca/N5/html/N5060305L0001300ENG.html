</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">煞車 - 駐車煞車系統 - 系統說明 - 系統</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5060203G0000C00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5060305L0001300ENG"><div class="title"><span>失效保護</span><div class="sieid">N5060305L0001300ENG</div></div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">系統發生故障時，電動駐車煞車警告燈及/或電動駐車指示燈會亮起。請參閱<a href="javascript:void(0)" onclick="openSIE('N5060305L0003I00ENG'); return false;">失效保護</a>.</div></li><li class="item noBottomMargin"><div class="ptxt">系統故障期間拉動/按壓駐車煞車開關時，若電動駐車煞車無法作動，電動駐車煞車指示燈會閃爍，且電動駐車煞車警告燈會亮起。此狀態會限制電動駐車煞車的鎖定與釋放作動。</div><div class="attention3 noBottomMargin"><div class="atten-title"><img class="attentionIcon" src="../icon/reference.webp">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">駐車煞車可採機械方式釋放。</div></div></div></li></ul></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5060204C0000B00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
