緣。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">填充隔音發泡材料後請等待 2 小時，再移除螺栓及鋁箔膠帶，然後使用烙鐵使隔音發泡材料熔化，以便固定扣等能完全插入已填充隔音發泡材料的孔洞中。</div></li></ul></div></div></div><div class="figure"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/CG20001VAA00ENG.webp', 'CG20001VAA00ENG')"><img src="../img/CG20001VAA00ENG.webp" width="323px" height="213px" large="../img/large/CG20001VAA00ENG.webp"></a></div></div><div class="attention3"><div class="atten-title"><img class="attentionIcon" src="../icon/reference.webp">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">視損損範圍而定，可進行局部更換。</div></div></div><div class="topic noBottomMargin"><div class="figure noBottomMargin"><div class="title">車身密封膠</div><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/CG20001WAA00ENG.webp', 'CG20001WAA00ENG')"><img src="../img/CG20001WAA00ENG.webp" width="323px" height="213px" large="../img/large/CG20001WAA00ENG.webp"></a></div></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5110909N0000F00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
