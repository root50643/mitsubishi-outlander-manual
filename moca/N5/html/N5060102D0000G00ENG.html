</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">煞車 - 煞車系統 - 定期保養 - 煞車油</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5060103C0006A00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5060102D0000G00ENG"><div class="title"><span>排放</span><div class="sieid">N5060102D0000G00ENG</div></div><div class="attention2"><div class="atten-title">注意：</div><div class="atten-body"><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">切勿使煞車油濺灑或飛濺至塗裝表面。煞車油可能嚴重損傷塗裝。若濺到塗裝表面，應立即擦拭並以水洗淨。煞車零件切勿以水洗滌。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">作業前，將點火開關關閉並斷開/拔除 ABS 作動器及電動單元（control unit）線束接頭，或斷開電瓶負極端子。</div></li></ul></div></div></div><div class="servinfosub"><div class="s1"><div class="ptxt">將乙烯管連接至排氣螺絲。</div><div id="fig1" class="figure noBottomMargin"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100AJUAA00ENG.webp', 'CF100AJUAA00ENG')"><img src="../img/CF100AJUAA00ENG.webp" width="301px" height="213px" large="../img/large/CF100AJUAA00ENG.webp"><div class="caption noBottomMargin">CF100AJUAA00ENG</div></a></div></div></div><div class="s1 noBottomMargin"><div class="ptxt noBottomMargin">踩下煞車踏板並鬆開排氣螺絲，使煞車油逐漸排出。</div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5060104G0000Y00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
