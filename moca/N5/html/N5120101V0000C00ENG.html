</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">駕駛員控制 - 後視鏡 - 系統說明 - 系統 - 數位後視鏡系統&lt;VEHICLES WITH DIGITAL REAR VIEW MIRROR SYSTEM&gt;</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5120103H0001Q00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5120101V0000C00ENG"><div class="title"><span>失效保護</span><div class="sieid">N5120101V0000C00ENG</div></div><div class="servinfosub"><div class="ptxt">若室內後視鏡總成發生異常，將執行下列失效保護控制。</div><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">若偵測到內建於室內後視鏡總成的 LCD 螢幕異常，LCD 螢幕將停止作動並切換至一般後視鏡模式。若異常解除，LCD 螢幕將自動恢復至螢幕模式。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">若偵測到後方攝影機單元異常，將於室內後視鏡總成的 LCD 螢幕上顯示錯誤畫面。若異常解除，錯誤畫面將消失且畫面自動恢復。</div></li></ul></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5120103O0001700ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
