</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">引擎&lt;4B4&gt; - 缸內直噴與多點燃油噴射 (DI AND MPI) - 說明</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5025001S0000300ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5025001T0000500ENG"><div class="title"><span>線性 A/F 感測器加熱器與氧氣感測器（後）加熱器控制</span><div class="sieid">N5025001T0000500ENG</div></div><div class="figure"><div id="i-q90o65q8mc224s0kk0967rsdb" class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF3001INAC00ENG.webp', 'DF3001INAC00ENG')"><img class=" noframe" src="../img/DF3001INAC00ENG.webp" width="853px" height="465px" large="../img/large/DF3001INAC00ENG.webp"></a></div></div><div class="ptxt">當排氣溫度較低時，線性 A/F 感測器與氧氣感測器（後）的反應較慢。因此，透過對加熱器施加電流以加熱感測器，以改善感測器在排氣低溫範圍內的反應性，例如在引擎起動後排氣溫度仍低時、暖機期間，以及減速時燃油切斷期間。ECM 依據線性 A/F 感測器與氧氣感測器（後）的運作條件或啟動條件，改變加熱器的占空比。此控制可使線性 A/F 感測器與氧氣感測器（後）更快地啟動。</div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N502500200000300ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
