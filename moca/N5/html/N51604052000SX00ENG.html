</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">駕駛員資訊與多媒體 - 音響、視覺與導航系統 - 環景監控系統 - 拆卸與安裝 - 後視攝影機</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N51604052000SW00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N51604052000SX00ENG"><div class="title"><span>拆卸及安裝</span><div class="sieid">N51604052000SX00ENG</div></div><div class="attention2 noBottomMargin"><div class="atten-title">注意：</div><div class="atten-body"><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">拆卸/安裝或更換攝影機時，應在環景監控系統的「鳥瞰視圖」中檢查攝影機影像。若有必要，請校正攝影機（請參閱<a href="javascript:void(0)" onclick="openSIE('N5160407Q0007300ENG'); return false;">作業程序</a>).</div></li><li class="item"><div class="ptxt noBottomMargin">為確保攝影機影像清晰可見，請先用濕布擦拭鏡頭，再以乾布擦拭，以去除灰塵、雨滴或雪。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">請小心不要損壞攝影機。任何損壞都可能對螢幕影像造成不利影響。</div></li></ul></div></div></div><div class="servinfosub"><div class="ptxt noBottomMargin">有關後視攝影機拆卸方法，請參閱<a href="javascript:void(0)" onclick="openSIE('N51604052000SU00ENG'); return false;">拆卸及安裝</a>.</div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N51604052000SY00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
