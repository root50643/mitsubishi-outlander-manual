noBottomMargin" id="par1">前束調整後，請執行轉向扭力校正。請參閱<a href="javascript:void(0)" onclick="openSIE('N5070203J0001W00ENG'); return false;">作業程序</a>.</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">調整後，請確認轉向角在標準範圍內。請參閱<a href="javascript:void(0)" onclick="openSIE('N5070102O0002900ENG'); return false;">檢查</a>.</div></li></ul></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5050101X0002B00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
