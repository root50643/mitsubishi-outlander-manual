</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">一般資訊 - 一般資訊 - 預防措施 - 預防措施/注意事項</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N501010960000500ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N501010970000500ENG"><div class="title"><span>使用加長工具時之鎖緊扭力</span><div class="sieid">N501010970000500ENG</div></div><div class="ptxt">使用加長工具時，請依下列公式計算扭力值 (T')。</div><div class="figureleftside"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/CF2002UDAA00ENG.webp', 'CF2002UDAA00ENG')"><img src="../img/CF2002UDAA00ENG.webp" width="322px" height="336px" large="../img/large/CF2002UDAA00ENG.webp"></a></div></div><div class="attention3"><div class="atten-title"><img class="attentionIcon" src="../icon/reference.webp">注意：</div><div class="atten-body"><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">若鎖緊至扭力扳手讀值達到規定扭力 (T)，則實際鎖緊扭力將過大。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">使用時務必確認扭力扳手與加長工具彼此以直線方式連接。若未以直線方式連接，鎖緊扭力將無法符合規定值。</div></li></ul></div></div></div><div class="ptxt">公式 T'=T×L2/(L1+L2)</div><div class="table"><table class="all tgroup notspec"><colgroup><col style="width:23.219373219373217%;"><col style="width:76.78062678062677%;"></colgroup><thead class="thead"><tr class="row noBottomMargin"><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">符號</div></td><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">項目</div></td></tr></thead><tbody class="tbody noBottomMargin"><tr class="row"><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">T'</div></td><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">扭力扳手讀值 (N·m)</div></td></tr><tr class="row"><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">T</div></td><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">規定鎖緊扭力 (N·m)</div></td></tr><tr class="row"><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">L1</div></td><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">加長工具長度 (mm)</div></td></tr><tr class="row noBottomMargin"><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">L2</div></td><td valign="middle" align="left" class="entry botright"><div class="ptxt noBottomMargin">扭力扳手長度 (mm)</div></td></tr></tbody></table></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N501011110000500ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
