</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">車身外觀、車門、車頂及車輛防盜 - 車身修復 - 基礎 - 服務資訊 - 修復程序與預防措施／注意事項 - 車身補土（填土）及研磨使用</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N511090660000C00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N511090680000C00ENG"><div class="title"><span>車身補土（填土）及研磨使用</span><div class="sieid">N511090680000C00ENG</div></div><div class="ptxt">鈑金不平整處可使用錘子及頂鐵修正。然而，使用這些工具精確恢復原始形狀需要較長時間。可使用車身補土恢復原始鈑金輪廓。為此目的，鈑金表面須修整至略低於原始表面。</div><div class="ptxt">施作補土以修整形狀，同時縮短修復所需時間。</div><div class="ptxt">在車身修復廠，最常使用的材料為車身補土、聚酯填土及細部填土。</div><div class="ptxt">本節主要說明車身補土。</div><div class="ptxt">聚酯填土於塗裝手冊中說明。</div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N511090690000C00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
