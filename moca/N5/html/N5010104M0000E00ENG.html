</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">一般資訊 - 一般資訊 - 預防措施 - 預防措施/注意事項</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5010102J0000E00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5010104M0000E00ENG"><div class="title"><span>三元催化器</span><div class="sieid">N5010104M0000E00ENG</div></div><div class="ptxt">若有大量未燃燒燃油流入催化器，催化器溫度將過高。為防止此情況，請依下列指示操作。</div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">僅使用無鉛汽油。含鉛汽油將嚴重損壞三元催化器。</div></li><li class="item"><div class="ptxt noBottomMargin">檢查點火火花或測量引擎壓縮比時，應迅速進行測試，且僅在必要時才進行。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">油箱油位過低時請勿運轉引擎，否則引擎可能失火，導致催化器損壞。</div></li></ul></div><div class="ptxt">請勿將車輛停放在易燃物附近。請使易燃物遠離排氣管及三元催化器。</div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5010103E0000E00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
