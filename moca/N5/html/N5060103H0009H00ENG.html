</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">煞車 - 煞車系統 - 拆卸與安裝 - 煞車踏板</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5060104I000BD00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5060103H0009H00ENG"><div class="title"><span>檢查與調整</span><div class="sieid">N5060103H0009H00ENG</div></div><div class="servinfosub" id="id0000000015313449S01"><div class="title">拆卸後檢查</div><div class="ptxt">檢查下列項目，必要時更換煞車踏板總成。</div><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt">檢查鉚釘<img class="inline" src="../img/CF1000KSAA00ENG.webp" width="16px" height="16px" name="CF1000KSAA00ENG">是否變形、龜裂及損壞。</div><div id="fig3" class="figure noBottomMargin"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/DF5000VTAA00ENG.webp', 'DF5000VTAA00ENG')"><img src="../img/DF5000VTAA00ENG.webp" width="424px" height="283px" large="../img/large/DF5000VTAA00ENG.webp"><div class="caption noBottomMargin">DF5000VTAA00ENG</div></a></div></div></li><li class="item"><div class="ptxt noBottomMargin">檢查煞車踏板是否彎曲、損壞，及焊接部位是否龜裂。</div></li><li class="item noBottomMargin"><div class="ptxt">檢查 U 型叉端子及塑膠擋塊<img class="inline" src="../img/CF1000KSAA00ENG.webp" width="16px" height="16px" name="CF1000KSAA00ENG">是否損壞及變形。必要時更換 U 型叉端子。</div><div id="fig2" class="figure noBottomMargin"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100AK4AA00ENG.webp', 'CF100AK4AA00ENG')"><img src="../img/CF100AK4AA00ENG.webp" width="301px" height="213px" large="../img/large/CF100AK4AA00ENG.webp"><div class="caption noBottomMargin">CF100AK4AA00ENG</div></a></div></div></li></ul></div></div><div class="servinfosub" id="id0000000015313449S02"><div class="title">安裝後調整</div><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">將煞車踏板總成安裝至車輛後，調整煞車踏板各項。請參閱<a href="javascript:void(0)" onclick="openSIE('N5060103H0003M00ENG'); return false;">檢查與調整</a>.</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">執行油門踏板釋放位置學習。請參閱說明<a href="javascript:void(0)" onclick="openSIE('N5020401G0005W00ENG'); return false;">說明</a>.</div></li></ul></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5060102N0005400ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
