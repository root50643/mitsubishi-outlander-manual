</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">車身外觀、車門、車頂與車輛安全 - 車身維修 - 基礎 - 服務資訊 - 車身焊接與預防措施/注意事項 - 焊接概要</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5110903Y0000C00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5110903Z0000E00ENG"><div class="title"><span>汽車車身焊接</span><div class="sieid">N5110903Z0000E00ENG</div></div><div class="ptxt">汽車車身係以焊接 0.6 mm - 1.4 mm (0.024 in - 0.055 in) 厚度的鋼板製造而成。就成本、品質及作業效率而言，點焊最為適合。在汽車生產線上，點焊廣泛使用，惟部分無法採用此程序的特定區域除外。現今點焊大多由機器人執行。</div><div class="ptxt">除點焊外，亦使用 MAG 銅焊。</div><div class="ptxt">汽車生產線不使用軟焊。</div><div class="ptxt">汽車總成線焊接程序如下所示。</div><div id="fig1" class="figure"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100BKGAA00ENG.webp', 'CF100BKGAA00ENG')"><img class=" noframe" src="../img/CF100BKGAA00ENG.webp" width="788px" height="843px" large="../img/large/CF100BKGAA00ENG.webp"><div class="caption noBottomMargin">CF100BKGAA00ENG</div></a></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N511090410000C00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
