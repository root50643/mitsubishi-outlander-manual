</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">引擎&lt;4B4&gt; - 直接噴射與多點燃油噴射 (DI AND MPI) - 說明 - 感知器</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N502500050000A00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N502500080000400ENG"><div class="title"><span>空氣流量感知器</span><div class="sieid">N502500080000400ENG</div></div><div class="figureleftside"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF30016OAA00ENG.webp', 'DF30016OAA00ENG')"><img class=" noframe" src="../img/DF30016OAA00ENG.webp" width="325px" height="215px" large="../img/large/DF30016OAA00ENG.webp"></a></div></div><div class="ptxt">空氣流量感知器安裝於空氣清淨器總成上，並置於進氣氣流中。其藉由測量整體進氣流量的一部分來測量進氣流量。空氣流量感知器將感測元件中加熱器的溫度控制在一定數值。加熱器周圍的溫度分佈會隨進氣量增加而改變。此變化由熱敏電阻偵測，進氣量資料經空氣流量感知器內的訊號處理電路進行頻率調變後傳送至 ECM。ECM 使用此輸出訊號與引擎車速來計算並決定基本燃油噴射時間。感知器特性如圖所示。</div><div class="figure"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF6002WTAB00ENG.webp', 'DF6002WTAB00ENG')"><img class=" noframe" src="../img/DF6002WTAB00ENG.webp" width="853px" height="354px" large="../img/large/DF6002WTAB00ENG.webp"></a></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N502500090000400ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
