</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">引擎&lt;4B4&gt; - 進氣與排氣 - 檢修</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N502451560000K00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N502451540000I00ENG"><div class="title"><span>中冷器冷卻液濃度檢查</span><div class="sieid">N502451540000I00ENG</div></div><div class="ptxt">使用比重計檢查中冷器冷卻液濃度是否在標準值範圍內。</div><div class="spec"><div class="ptxt noBottomMargin">標準值：30 至 60%（維修濃度範圍）</div></div><div class="attention2"><div class="atten-title">注意：</div><div class="atten-body"><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">中冷器冷卻液濃度低於 30% 時防鏽效果較差；濃度超過 60% 時，防凍效果及中冷器冷卻性能會劣化，對中冷器造成不利影響。因此，務必遵守維修濃度範圍。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">使用三菱汽車原廠 SUPER LONG LIFE COOLANT PREMIUM，勿加水，因其濃度已預先調整為 50%。</div></li></ul></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N502451650000I00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
