</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">變速箱與傳動系統 - 變速箱與變速系統 - CVT&lt;F1CJD, W1CJD&gt; - 拆卸與安裝 - CVT 變速箱油濾清器蓋</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N504020CR0006K00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N504020CS0005Y00ENG"><div class="title"><span>拆卸與安裝</span><div class="sieid">N504020CS0005Y00ENG</div></div><div class="servinfosub" id="pro2"><div class="title">拆卸</div><div class="topic noBottomMargin"><div class="attention3"><div class="atten-title"><img class="attentionIcon" src="../icon/reference.webp">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin" id="par7">若變速箱油從變速箱油濾清器蓋漏出，請更換 O 形環。此情況下無需更換 CVT 變速箱油濾清器。</div></div></div><div id="pro1" class="s1"><div class="ptxt noBottomMargin" id="par1">拆下引擎下護蓋。請參閱<a href="javascript:void(0)" onclick="openSIE('N5110703L000BP00ENG'); return false;">拆卸與安裝</a>.</div></div><div id="pro3" class="s1 noBottomMargin"><div class="ptxt noBottomMargin" id="par2">拆下螺栓並拆下 CVT 變速箱油濾清器蓋。</div></div></div></div><div class="servinfosub" id="pro5"><div class="title">安裝</div><div class="ptxt" id="par4">安裝順序與拆卸相反。</div><div class="attention2"><div class="atten-title">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin" id="par6">請勿重複使用 O 形環。</div></div></div><div class="list1 noBottomMargin"><ul class="bullet"><li class="item noBottomMargin"><div class="ptxt noBottomMargin" id="par5">安裝 CVT 變速箱油濾清器蓋前，請將乾淨的 CVT 變速箱油塗抹於 O 形環上。</div></li></ul></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5040201V0004700ENG.html'; return false;">  </a></div><div id="balloon" class="balloon
