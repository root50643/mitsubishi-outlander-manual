</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">變速箱與傳動系統 - 變速驅動橋與變速箱 - CVT&lt;F1CJD, W1CJD&gt; - 拆卸與安裝 - 塞子</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N504020CR0006L00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N504020CS0005Z00ENG"><div class="title"><span>拆卸與安裝</span><div class="sieid">N504020CS0005Z00ENG</div></div><div class="servinfosub" id="pro3"><div class="title">拆卸</div><div class="attention3"><div class="atten-title"><img class="attentionIcon" src="../icon/reference.webp">備註：</div><div class="atten-body"><div class="ptxt noBottomMargin">若塞子漏油，請更換 O 形環。</div></div></div><div class="topic noBottomMargin"><div id="pro1" class="s1"><div class="ptxt noBottomMargin">拆下引擎下護板。請參閱<a href="javascript:void(0)" onclick="openSIE('N5110703L000BP00ENG'); return false;">拆卸與安裝</a>.</div></div><div id="pro2" class="s1"><div class="ptxt noBottomMargin" id="par3">鬆開前葉子板保護板側蓋（LH）前側。請參閱<a href="javascript:void(0)" onclick="openSIE('N5110703K0006800ENG'); return false;">分解圖</a>.</div></div><div id="pro4" class="s1 noBottomMargin"><div class="ptxt noBottomMargin" id="par1">拆下塞子與 O 形環。</div></div></div></div><div class="servinfosub" id="pro5"><div class="title">安裝</div><div class="ptxt" id="par2">安裝順序與拆卸相反。</div><div class="attention2 noBottomMargin"><div class="atten-title">注意：</div><div class="atten-body"><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">請勿重複使用 O 形環。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">在 O 形環上塗抹 CVT 油液。</div></li></ul></div></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" oncl
