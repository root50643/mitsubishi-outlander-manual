</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">通風、暖氣與空調 - 暖氣與空調控制系統 - 自動空調 - 系統說明 - 元件零件</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N509030510000E00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N509030520001300ENG"><div class="title"><span>進氣感測器</span><div class="sieid">N509030520001300ENG</div></div><div class="servinfosub" id="id0000000015411818S01"><div class="title">系統內組件功能</div><div class="ptxt">進氣感測器將以熱敏電阻偵測到的蒸發器表面溫度轉換為電壓，並由 A/C 放大器輸入此電壓。</div><div id="fig3" class="figure noBottomMargin"><div id="i-g2v6mq2jrptu4qt2c2bpv5b9i1" class="graphic"><a href="javascript:ViewLargeIllust('../img/large/DF100AVDAA00ENG.webp', 'DF100AVDAA00ENG')"><img src="../img/DF100AVDAA00ENG.webp" width="301px" height="213px" large="../img/large/DF100AVDAA00ENG.webp"><div class="caption noBottomMargin">DF100AVDAA00ENG</div></a></div></div></div><div class="servinfosub" id="id0000000015411818S02"><div class="title">個別組件功能</div><div class="ptxt noBottomMargin">進氣感測器測量蒸發器溫度（通過空氣溫度）。</div></div><div class="servinfosub" id="id0000000015411818S03"><div class="title">組件作動</div><div class="ptxt">感測器使用對溫度變化敏感的熱敏電阻。熱敏電阻的電阻值隨溫度升高而降低。</div><div id="fig2" class="figure noBottomMargin"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100AVEAA00ENG.webp', 'CF100AVEAA00ENG')"><img src="../img/CF100AVEAA00ENG.webp" width="301px" height="213px" large="../img/large/CF100AVEAA00ENG.webp"><div class="caption noBottomMargin">CF100AVEAA00ENG</div></a></div></div></div><div class="servinfosub" id="id0000000015411818S04"><div class="title">組件零件位置</div><div class="ptxt">進氣感測器位於蒸發器上。</div><div class="ptxt noBottomMargin">請參閱<a href="javascript:void(0)" onclick="openSIE('N5090300W0001F00ENG'); return false;">元件位置</a>.</div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N509030530000B00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
