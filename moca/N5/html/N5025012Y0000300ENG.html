</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">引擎&lt;4B4&gt; - 直接噴射及多點燃油噴射（DI 與 MPI）- 開啟-車輛保養</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N502500470000D00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5025012Y0000300ENG"><div class="title"><span>於引擎室作業注意事項</span><div class="sieid">N5025012Y0000300ENG</div></div><div class="attention1"><div class="atten-title">警告：</div><div class="atten-body"><div class="ptxt noBottomMargin">點火開關轉至關閉位置後，必須在冷卻風扇停止運轉的情況下進行調整。點火開關轉至關閉位置後，冷卻風扇可能因熄火後風扇控制而運轉數分鐘。若在冷卻風扇運轉時進行調整，可能會造成人員傷害或損壞。</div></div></div><div class="attention1"><div class="atten-title">警告：</div><div class="atten-body"><div class="ptxt">切勿從皮帶傳動起動發電機的接頭端子取電，因為與 12V 系統相關的元件不同，皮帶傳動起動發電機以 48 V 高電壓運作。</div><div class="ptxt noBottomMargin">此外，檢查皮帶傳動起動發電機時，請確保 48V 線路未施加電壓。</div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5025002A0000300ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
