</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">懸吊 - 前懸吊 - 預防措施 - 預防措施/注意事項</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N505010530001600ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5050103H0000F00ENG"><div class="title"><span>懸吊系統預防措施/注意事項</span><div class="sieid">N5050103H0000F00ENG</div></div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt">安裝橡膠襯套時，最終鎖緊必須在空車狀態下且輪胎離地時執行。潑濺的油液可能會縮短橡膠襯套壽命。務必擦拭掉任何潑濺的油液。</div><div class="list2 noBottomMargin"><ul class="bullet"><li class="item noBottomMargin"><div class="ptxt noBottomMargin">空車狀態係指燃油、引擎冷卻液及潤滑油均為滿液位。備胎、千斤頂、手工具和腳踏墊均置於指定位置。</div></li></ul></div></li><li class="item"><div class="ptxt noBottomMargin">維修懸吊零件後，務必檢查車輪定位校正。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">自鎖螺帽不可重複使用。安裝時一律使用新的。由於新的自鎖螺帽已預先塗油，請直接鎖緊即可。</div></li></ul></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5050103U0000F00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
