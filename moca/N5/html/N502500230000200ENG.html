</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">引擎&lt;4B4&gt; - 直接噴射與多點燃油噴射 (DI AND MPI) - 說明</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N502500210000200ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N502500230000200ENG"><div class="title"><span>蒸發排放控制系統不當淨化流量監測 &lt;台灣規格車輛&gt;</span><div class="sieid">N502500230000200ENG</div></div><div class="figure"><div id="i-7jsv2rpg6iiq48t8uqu57n3vv3" class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF30027WAB00ENG.webp', 'DF30027WAB00ENG')"><img class=" noframe" src="../img/DF30027WAB00ENG.webp" width="853px" height="738px" large="../img/large/DF30027WAB00ENG.webp"></a></div></div><div class="ptxt">ECM 會偵測蒸發排放控制系統是否存在燃油蒸氣洩漏。ECM 依特定作動範圍內之規定模式，驅動淨化控制電磁閥及通風電磁閥。這會使油箱內產生些微真空。</div><div class="ptxt">ECM 透過油箱壓力感測器訊號量測真空狀態。透過比對正常（預期）值與實際值，ECM 偵測蒸發排放控制系統是否存在燃油蒸氣洩漏。</div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5025001X0000801ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
