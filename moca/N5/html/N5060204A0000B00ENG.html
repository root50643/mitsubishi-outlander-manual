</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">煞車 - 駐車煞車系統 - 系統說明 - 組件零件</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5060305S0000E00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5060204A0000B00ENG"><div class="title"><span>駐車煞車 作動器</span><div class="sieid">N5060204A0000B00ENG</div></div><div class="servinfosub" id="idSE1"><div class="title">系統內功能</div><div class="ptxt">駐車煞車作動器<img class="inline" src="../img/CF1000PMAA00ENG.webp" width="16px" height="16px" name="CF1000PMAA00ENG">藉由移動後煞車卡鉗活塞來啟動/釋放駐車煞車<img class="inline" src="../img/CF1000PQAA00ENG.webp" width="16px" height="16px" name="CF1000PQAA00ENG">依 ABS 作動器及電氣單元（控制單元）之訊號作動。</div><div id="fig2" class="figure noBottomMargin"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100ALRAA00ENG.webp', 'CF100ALRAA00ENG')"><img src="../img/CF100ALRAA00ENG.webp" width="301px" height="213px" large="../img/large/CF100ALRAA00ENG.webp"><div class="caption noBottomMargin">CF100ALRAA00ENG</div></a></div></div></div><div class="servinfosub" id="idSE2"><div class="title">系統內個別功能</div><div class="ptxt noBottomMargin">駐車煞車作動器由馬達、齒輪等組成。</div></div><div class="servinfosub" id="idSE3"><div class="title">個別作動</div><div class="ptxt">藉由將馬達旋轉輸出傳遞至後煞車卡鉗活塞來作動/釋放駐車煞車。</div><div class="attention3 noBottomMargin"><div class="atten-title"><img class="attentionIcon" src="../icon/reference.webp">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">煞車狀態以機械方式維持。並非持續受控。</div></div></div></div><div class="servinfosub" id="idSE4"><div class="title">零件位置</div><div class="ptxt">請參閱<a href="javascript:void(0)" onclick="openSIE('N5060200Y0000V00ENG'); return false;">組成零件位置</a>.</div><div class="attention2 noBottomMargin"><div class="atten-title">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">若駐車煞車作動器已自後煞車卡鉗拆下，切勿重複使用該駐車煞車作動器。</div></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5060203G0000C00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
