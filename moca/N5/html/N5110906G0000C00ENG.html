</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">車身外觀、車門、車頂與車輛安全 - 車身修復 - 基礎 - 服務資訊 - 修復程序與預防措施/注意事項 - 鏽蝕與腐蝕修復</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5110906E0000C00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5110906G0000C00ENG"><div class="title"><span>鏽蝕與腐蝕修復</span><div class="sieid">N5110906G0000C00ENG</div></div><div class="ptxt">鋼板上的鏽蝕是鋼鐵與空氣中氧氣發生化學反應的結果，稱為氧化。若不處理，鏽蝕會擴大並最終腐蝕而損壞鋼板。若車輛長期在嚴苛環境條件下使用，車身表面可能產生鏽蝕或腐蝕。修復鏽蝕與腐蝕時，必須防止鏽蝕從已修復部位擴散。</div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5110906H0000C00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
