</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">通風、暖氣及空調 - 暖氣及空調系統 - 拆卸與安裝 - 暖氣機冷卻機組總成 - 膨脹閥</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5090204N0009C00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5090204N0009B00ENG"><div class="title"><span>拆卸及安裝</span><div class="sieid">N5090204N0009B00ENG</div></div><div class="servinfosub" id="id0000000015313215S01"><div class="title">拆卸</div><div class="topic noBottomMargin"><div class="s1"><div class="ptxt noBottomMargin">拆卸暖氣機冷卻機組總成。請參閱<a href="javascript:void(0)" onclick="openSIE('N509022410000600ENG'); return false;">暖氣機冷卻機組總成拆卸與安裝</a>.</div></div><div class="s1"><div class="ptxt noBottomMargin">拆卸冷卻機組隔熱填充材。</div></div><div class="s1 noBottomMargin"><div class="ptxt">拆下固定螺栓，然後拆卸膨脹閥。</div><div class="attention2 noBottomMargin"><div class="atten-title">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">以膠帶等適當材料封蓋或包覆蒸發器與膨脹閥接頭，避免空氣進入。</div></div></div></div></div></div><div class="servinfosub" id="id0000000015313215S02"><div class="title">安裝</div><div class="ptxt">注意下列事項，然後依拆卸的相反順序安裝。</div><div class="attention2 noBottomMargin"><div class="atten-title">注意：</div><div class="atten-body"><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">更換為新的 O 形環。安裝時塗抹空調壓縮機油。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">充填冷媒時檢查是否洩漏。</div></li></ul></div></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N509020510000A00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加
