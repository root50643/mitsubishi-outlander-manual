</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">RESTRAINTS - 安全氣囊 - 系統說明 - 元件 - 主要元件與功能</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N508030560000D00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N508030580000C00ENG"><div class="title"><span>螺旋電纜</span><div class="sieid">N508030580000C00ENG</div></div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt">螺旋電纜以電氣方式連接安全氣囊診斷感知器單元與駕駛座安全氣囊模組。螺旋電纜主要由旋轉部<img class="inline" src="../img/CF1000KSAA00ENG.webp" width="16px" height="16px" name="CF1000KSAA00ENG">其與方向盤同步動作，固定外殼<img class="inline" src="../img/CF1000KUAA00ENG.webp" width="16px" height="16px" name="CF1000KUAA00ENG">其安裝於方向盤上，以及連接旋轉部的電纜所構成。</div><div id="fig1" class="figure noBottomMargin"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100AQRAA00ENG.webp', 'CF100AQRAA00ENG')"><img src="../img/CF100AQRAA00ENG.webp" width="301px" height="213px" large="../img/large/CF100AQRAA00ENG.webp"><div class="caption noBottomMargin">CF100AQRAA00ENG</div></a></div></div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">螺旋電纜内建於轉向角度感知器，該感知器安裝於組合開關與方向盤之間的空間。</div></li></ul></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N508030590000C00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
