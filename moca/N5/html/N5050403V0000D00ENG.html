</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">懸吊 - 車輪與輪胎 - 系統說明 - 元件零件</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5050400V0000B00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5050403V0000D00ENG"><div class="title"><span>BCM</span><div class="sieid">N5050403V0000D00ENG</div></div><div class="servinfosub" id="id0000000014666911S01"><div class="title">系統內功能</div><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">胎壓接收器整合於 BCM 內。</div></li><li class="item noBottomMargin"><div class="ptxt">BCM 從各車輪的胎壓感測器透過無線電訊號接收輪胎氣壓與輪胎溫度信號作為輸入，並控制胎壓監測系統。</div><div id="fig1" class="figure noBottomMargin"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100AICAA00ENG.webp', 'CF100AICAA00ENG')"><img src="../img/CF100AICAA00ENG.webp" width="301px" height="213px" large="../img/large/CF100AICAA00ENG.webp"><div class="caption noBottomMargin">CF100AICAA00ENG</div></a></div></div></li></ul></div></div><div class="servinfosub" id="id0000000014666911S02"><div class="title">系統內各項個別功能</div><div class="ptxt noBottomMargin">當胎壓降低至低於規定值或系統發生故障時，BCM 透過 CAN 通訊點亮儀表板上的胎壓警告燈。</div></div><div class="servinfosub" id="id0000000014666911S03"><div class="title">個別作動</div><div class="ptxt noBottomMargin">請參閱<a href="javascript:void(0)" onclick="openSIE('N5050402U0000B00ENG'); return false;">系統說明</a>.</div></div><div class="servinfosub" id="id0000000014666911S04"><div class="title">零件位置</div><div class="ptxt noBottomMargin">請參閱<a href="javascript:void(0)" onclick="openSIE('N5050400V0000B00ENG'); return false;">元件位置</a>.</div></div></div><div class="nextsie noBottom
