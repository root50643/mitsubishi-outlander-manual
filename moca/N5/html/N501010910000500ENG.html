</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">一般資訊 - 一般資訊 - 預防措施 - 預防措施/注意事項</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5010102D0000E00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N501010910000500ENG"><div class="title"><span>檢查前狀態</span><div class="sieid">N501010910000500ENG</div></div><div class="ptxt">「檢查前狀態」係指在進行正確引擎檢查之前，車輛必須處於的狀態。若在本手冊中看到「將車輛設定為檢查前狀態」字樣，即表示將車輛設定為以下狀態。</div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">引擎冷卻液溫度：80 - 90°C (176 - 194°F)</div></li><li class="item"><div class="ptxt noBottomMargin">燈光、電動冷卻風扇及所有附件：關閉</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">CVT：P 檔</div></li></ul></div><div class="attention3"><div class="atten-title"><img class="attentionIcon" src="../icon/reference.webp">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin">加拿大規格車輛，即使燈光開關於「關閉」位置，頭燈、尾燈等仍保持點亮，但這對檢查沒有影響。</div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N501010950000500ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
