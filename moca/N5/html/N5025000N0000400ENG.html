</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">引擎&lt;4B4&gt; - 直接噴射與多點燃油噴射 (DI AND MPI) - 說明 - 感知器</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5025000M0000300ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5025000N0000400ENG"><div class="title"><span>爆震感知器</span><div class="sieid">N5025000N0000400ENG</div></div><div class="figureleftside"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF300183AA00ENG.webp', 'DF300183AA00ENG')"><img class=" noframe" src="../img/DF300183AA00ENG.webp" width="323px" height="213px" large="../img/large/DF300183AA00ENG.webp"></a></div></div><div class="ptxt">爆震感知器安裝於汽缸蓋進氣側。爆震感知器利用壓電元件，將引擎作動時汽缸蓋產生的振動轉換為微小電壓並輸出至 ECM。ECM 透過汽缸蓋固有頻率濾波後，使用爆震感知器輸出的微小電壓來偵測爆震，並依爆震強度補償點火正時延遲。</div><div class="figure"><div class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF3006DIAC00ENG.webp', 'DF3006DIAC00ENG')"><img class=" noframe" src="../img/DF3006DIAC00ENG.webp" width="853px" height="281px" large="../img/large/DF3006DIAC00ENG.webp"></a></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5025000O0000400ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
