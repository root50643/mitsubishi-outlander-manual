</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">車身外觀、車門、車頂 &amp; 車輛防盜 - 車身修復 - 基礎 - 服務資訊 - 車身焊接與預防措施/注意事項 - 電弧焊接</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5110904E0000C00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5110904F0000C00ENG"><div class="title"><span>MIG 與 MAG 焊接機結構</span><div class="sieid">N5110904F0000C00ENG</div></div><div class="ptxt">焊接機由電源裝置組成，電源裝置包含變壓器及整流器，可將來源電壓轉換為焊接電壓並將電流整流。控制器可依焊接板厚度控制電壓、電流及焊條送進速度。另包含纏繞於焊條線軸上的焊條、送線馬達、焊接火炬、氣體鋼瓶及調壓器。</div><div id="fig1" class="figure"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100BL3AA00ENG.webp', 'CF100BL3AA00ENG')"><img src="../img/CF100BL3AA00ENG.webp" width="788px" height="614px" large="../img/large/CF100BL3AA00ENG.webp"><div class="caption noBottomMargin">CF100BL3AA00ENG</div></a></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5110904G0000C00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
