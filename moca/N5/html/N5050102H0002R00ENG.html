</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">懸吊 - 前懸吊 - 拆卸及安裝 - 前螺旋彈簧及支柱</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5050101L0000X00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5050102H0002R00ENG"><div class="title"><span>檢查</span><div class="sieid">N5050102H0002R00ENG</div></div><div class="servinfosub" id="id0000000015319626S01"><div class="title">拆解後檢查</div><div class="ptxt">檢查下列項目，必要時更換零件。</div><div class="topic" id="id0000000015319626S0101"><div class="title">支柱</div><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">支柱是否有變形、裂紋或損壞</div></li><li class="item"><div class="ptxt noBottomMargin">活塞桿是否有損壞、磨損不均或變形</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">機油洩漏</div></li></ul></div></div><div class="topic" id="id0000000015319626S0102"><div class="title">支柱安裝絕緣體及限位緩衝塊</div><div class="ptxt noBottomMargin">檢查支柱安裝絕緣體及限位緩衝塊是否有裂紋、磨損或損壞。</div></div><div class="topic noBottomMargin" id="id0000000015319626S0103"><div class="title">螺旋彈簧</div><div class="ptxt noBottomMargin">檢查螺旋彈簧是否有裂紋、磨損或損壞。</div></div></div><div class="servinfosub" id="id0000000015319626S02"><div class="title">安裝後檢查</div><div class="topic noBottomMargin"><div class="s1"><div class="ptxt noBottomMargin">檢查車輪速感測器線束接頭是否確實。請參閱<a href="javascript:void(0)" onclick="openSIE('N5060302N0001800ENG'); return false;">分解圖</a>.</div></div><div class="s1"><div class="ptxt noBottomMargin">檢查車輪校正。請參閱<a href="javascript:void(0)" onclick="openSIE('N5050102H0004P00ENG'); return false;">檢查</a>.</div></div><div class="s1 noBottomMargin"><div class="ptxt noBottomMargin">調整轉向角度感測器的中立位置。請參閱說明<a href="javascript:void(0)" onclick="openSIE('N506030200006500ENG'); return false;">說明</a>.</div></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5050101M0000F00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
