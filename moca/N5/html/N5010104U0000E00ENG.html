</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">一般資訊 - 一般資訊 - 注意事項 - 拖車牽引</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5010104P0000E00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5010104U0000E00ENG"><div class="title"><span>車輛救援（解困車輛）</span><div class="sieid">N5010104U0000E00ENG</div></div><div class="attention2"><div class="atten-title">注意：</div><div class="atten-body"><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin" id="par4">請勿拖曳 12V 電瓶電量過低或沒電的受困車輛。若 12V 電瓶電量過低或沒電，變速箱無法切換至空檔。</div></li><li class="item"><div class="ptxt noBottomMargin" id="par1">三菱汽車並未提供作為正廠零件用之拖曳及固定（運送等）導環。</div></li><li class="item"><div class="ptxt noBottomMargin" id="par2">請勿拖曳其他車輛。</div></li><li class="item"><div class="ptxt noBottomMargin" id="par5">請勿讓車輛被拖曳。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin" id="par3">若車輛受困等情況，請聯絡專業拖吊服務以救援車輛。</div></li></ul></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N501010880000B00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
