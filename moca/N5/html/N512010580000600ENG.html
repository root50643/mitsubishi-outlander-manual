</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">駕駛控制 - 後視鏡 - 系統說明 - 元件零件</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N512010420000K00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N512010580000600ENG"><div class="title"><span>車內後視鏡</span><div class="sieid">N512010580000600ENG</div></div><div class="servinfosub" id="idSE1"><div class="title">系統內元件功能</div><div class="ptxt">接收經由 LVDS 通訊由後方攝影機單元傳送的攝影機影像訊號，並在 LCD 螢幕上顯示該影像。</div><div id="fig2" class="figure noBottomMargin"><div id="i-o396sjaa6ol24n5lor4oa48vsc" class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF5000X7AB00ENG.webp', 'DF5000X7AB00ENG')"><img src="../img/DF5000X7AB00ENG.webp" width="323px" height="213px" large="../img/large/DF5000X7AB00ENG.webp"></a></div></div></div><div class="servinfosub" id="idSE2"><div class="title">個別元件功能</div><div class="ptxt noBottomMargin">控制亮度調整、影像位置調整等。</div></div><div class="servinfosub" id="idSE3"><div class="title">元件作動</div><div class="ptxt">當車內後視鏡總成下部的模式切換撥桿移至開啟位置時，後視鏡進入監視器模式，後方攝影機單元傳送的影像顯示於車內後視鏡總成內建的 LCD 螢幕上。當模式切換撥桿移至關閉位置時，車內後視鏡總成進入一般後視鏡模式。</div><div id="fig1" class="figure noBottomMargin"><div id="i-pldsp5elcfk7434pb541fki6e7" class="graphic"><a href="javascript:ViewLargeIllust('../img/large/DF100BTWAA00ENG.webp', 'DF100BTWAA00ENG')"><img src="../img/DF100BTWAA00ENG.webp" width="790px" height="215px" large="../img/large/DF100BTWAA00ENG.webp"></a></div><div id="i-e6r8npigi0ct46sp7mdldb72t9" class="graphic noBottomMargin"><a href="javascript:ViewLargeIllust('../img/large/DF5000XQAA00ENG.webp', 'DF5000XQAA00ENG')"><img src="../img/DF5000XQAA00ENG.webp" width="850px" height="323px" large="../img/large/DF5000XQAA00ENG.webp"></a></div></div></div><div class="servinfosub" id="idSE4"><div class="title">零件位置</div><div class="ptxt noBottomMargin">安裝於擋風玻璃上。請參閱<a href="javascript:void(0)" onclick="openSIE('N5120100X0001A00ENG'); return false;">零件位置</a>.</div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N512010530000800ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
