</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">懸吊系統 - 後懸吊 - 拆卸與安裝 - 後懸吊臂</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N505020210002S00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5050203N0002S00ENG"><div class="title"><span>拆卸及安裝</span><div class="sieid">N5050203N0002S00ENG</div></div><div class="servinfosub" id="id0000000015318636S01"><div class="title">拆卸</div><div class="topic noBottomMargin"><div class="s1"><div class="ptxt noBottomMargin">拆下後懸吊橫樑。請參閱<a href="javascript:void(0)" onclick="openSIE('N5050203N0005H00ENG'); return false;">拆卸及安裝</a>.</div></div><div id="pro1" class="s1"><div class="ptxt" id="par1">拆下後懸吊臂安裝螺栓<img class="inline" src="../img/CF1000KSAA00ENG.webp" width="16px" height="16px" name="CF1000KSAA00ENG">與螺帽<img class="inline" src="../img/CF1000KUAA00ENG.webp" width="16px" height="16px" name="CF1000KUAA00ENG">, 然後拆下後懸吊臂<img class="inline" src="../img/CF1000PMAA00ENG.webp" width="16px" height="16px" name="CF1000PMAA00ENG">自後懸吊橫樑<img class="inline" src="../img/CF1000PQAA00ENG.webp" width="16px" height="16px" name="CF1000PQAA00ENG">.</div><div id="fig1" class="figure noBottomMargin"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100AI6AA00ENG.webp', 'CF100AI6AA00ENG')"><img src="../img/CF100AI6AA00ENG.webp" width="301px" height="213px" large="../img/large/CF100AI6AA00ENG.webp"><div class="caption noBottomMargin">CF100AI6AA00ENG</div></a></div></div></div><div id="pro2" class="s1 noBottomMargin"><div class="ptxt noBottomMargin" id="par3">拆卸後執行檢查。請參閱<a href="javascript:void(0)" onclick="openSIE('N5050202H0003M00ENG'); return false;">檢查</a>.</div></div></div></div><div class="servinfosub" id="id0000000015318636S02"><div class="title">安裝</div><div class="ptxt">注意下列事項，並依拆卸相反順序安裝。</div><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">於無負載狀態、輪胎置於水平地面時，在車輛安裝位置（橡膠襯套）對固定零件執行最終鎖緊。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">安裝後執行檢查。請參閱<a href="javascript:void(0)" onclick="openSIE('N5050202H0003M00ENG'); return false;">檢查</a>.</div></li></ul></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5050202H0003M00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
