n"><div class="atten-title">注意：</div><div class="atten-body"><div class="ptxt noBottomMargin" id="par1">拆卸及安裝進氣感知器時，切勿轉動支架插入部位。</div></div></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5090307I0003700ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
