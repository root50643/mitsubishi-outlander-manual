</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">電氣與電力控制 - 車身控制系統 - 系統說明 - 系統 - 出貨模式控制系統</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N5140202T0004G00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N5140202T0004H00ENG"><div class="title"><span>系統說明</span><div class="sieid">N5140202T0004H00ENG</div></div><div class="servinfosub" id="idSE1"><div class="title">系統圖</div><div id="fig1" class="figure noBottomMargin"><div class="graphic"><a href="javascript:ViewLargeIllust('../img/large/CF100C0WAA00ENG.webp', 'CF100C0WAA00ENG')"><img src="../img/CF100C0WAA00ENG.webp" width="788px" height="535px" large="../img/large/CF100C0WAA00ENG.webp"><div class="caption noBottomMargin">CF100C0WAA00ENG</div></a></div></div></div><div class="servinfosub" id="idSE2"><div class="title">說明</div><div class="list1 noBottomMargin"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">BCM 依據延長儲存保險絲開關狀態，自行切換狀態（出貨模式或正常模式），並透過 CAN 通訊將出貨模式狀態訊號傳送給儀表及各單元。</div></li><li class="item"><div class="ptxt noBottomMargin">當出貨模式功能運作時，各控制單元不偵測 故障碼。</div></li><li class="item"><div class="ptxt noBottomMargin">在出貨模式下 BCM 控制功能受到限制。請參閱<a href="javascript:void(0)" onclick="openSIE('N514020120003P00ENG'); return false;">說明</a>.</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">當 BCM 處於出貨模式時，儀表於資訊顯示器上顯示延長儲存保險絲警告訊息。</div></li></ul></div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N5140203E0001600ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
