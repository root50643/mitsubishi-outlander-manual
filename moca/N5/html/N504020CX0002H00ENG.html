</head><body lang="ENG" class="ENG moca"><div class="sieHeader"><div class="sieCommandBar"><div class="sieBookmarkWrapper"><button class="sieBookmark" onclick="bookmarkSIE(); return;" type="button">  </button></div><div class="siePrintWrapper"><button class="siePrint" onclick="printSIE(); return;" type="button">  </button></div></div><div class="pathlist">變速箱 &amp; 傳動系統 - 變速驅動橋 &amp; 變速箱 - CVT&lt;F1CJD, W1CJD&gt; - 拆卸與安裝 - 油底殼</div></div><div class="prevsie"><a href="#" onclick="document.location.href = 'N504020CS0005P00ENG.html'; return false;">  </a></div><div class="servinfo noBottomMargin" id="N504020CX0002H00ENG"><div class="title"><span>檢查與調整</span><div class="sieid">N504020CX0002H00ENG</div></div><div class="servinfosub" id="id0000000014447539sub1"><div class="title">拆卸後檢查</div><div class="ptxt">檢查油底殼是否有異物。</div><div class="list1"><ul class="bullet"><li class="item"><div class="ptxt noBottomMargin">若發現大量磨耗物質，離合器片可能已磨耗。</div></li><li class="item"><div class="ptxt noBottomMargin">若發現鐵粉，軸承、齒輪或離合器片可能已磨耗。</div></li><li class="item noBottomMargin"><div class="ptxt noBottomMargin">若發現鋁粉，襯套可能已磨耗，或鋁鑄件之切屑、毛刺可能已進入。</div></li></ul></div><div class="ptxt noBottomMargin">所有情況均須檢查發現磨耗之部位。</div></div><div class="servinfosub" id="id0000000014447539sub2"><div class="title">安裝後檢查</div><div class="ptxt noBottomMargin">檢查 CVT 油品是否洩漏。請參閱<a href="javascript:void(0)" onclick="openSIE('N5040201V0003Z00ENG'); return false;">檢查</a>.</div></div></div><div class="nextsie noBottomMargin"><a href="#" onclick="document.location.href = 'N504020CR0006C00ENG.html'; return false;">  </a></div><div id="balloon" class="balloon"><span class="balloonOK"><span>已加入書籤</span></span><span class="balloonNG"><span>書籤數量過多。<br>請刪除後重新加入書籤。</span></span><button id="exitButton" type="button" onclick="closeBalloon(); return;">×</button></div></body></html>
